# Unit-4 Reel のパス骨格（Q1=refinedA）。詳細は Unit-4 が非破壊で追記。
reel:
  get:
    operationId: getReel
    tags: [reel]
    summary: リールフィード取得（骨格、UC-02）
    parameters:
      - $ref: '../components/parameters/common.yaml#/Cursor'
      - $ref: '../components/parameters/common.yaml#/Limit'
      - $ref: '../components/parameters/common.yaml#/CorrelationId'
    responses:
      '200':
        description: リールカードのページ
        content:
          application/json:
            schema:
              type: object
      '401':
        $ref: '../components/responses/problem-details.yaml#/Unauthorized'

amazonTransitions:
  post:
    operationId: recordAmazonTransition
    tags: [reel]
    summary: Amazon 遷移記録（骨格、B-13 / EXP 加算）
    parameters:
      - $ref: '../components/parameters/common.yaml#/CorrelationId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
    responses:
      '201':
        description: 記録（EXP 加算結果）
      '401':
        $ref: '../components/responses/problem-details.yaml#/Unauthorized'
      '409':
        description: セーフガード発動（safeguard.monthly-limit-exceeded 等）
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas/common.yaml#/ProblemDetails'

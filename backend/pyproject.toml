[tool.poetry]
name = "yudane-backend"
version = "0.1.0"
description = "YUDANE バックエンド（Python 3.13 Lambda 群）"
authors = ["YUDANE Team"]
license = "SEE LICENSE IN LICENSE"
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.13"
boto3 = "^1.35.0"
aws-lambda-powertools = { extras = ["tracer", "validation"], version = "^3.3.0" }
pydantic = "^2.10.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^6.0.0"
hypothesis = "^6.122.0"
moto = "^5.0.0"
mypy = "^1.13.0"
ruff = "^0.8.0"
schemathesis = "^3.39.0"
datamodel-code-generator = "^0.26.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# 規約: tech-python.md §1
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
# テストでは assert / ドキュメント文字列の一部ルールを緩和
"tests/**/*.py" = ["S101", "D"]
# 生成ファイルは Lint 対象外
"src/common/models/api.py" = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
strict = true
disallow_untyped_defs = true
warn_return_any = true
exclude = ["src/common/models/api.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-branch"

[tool.coverage.run]
omit = ["src/common/models/api.py"]
